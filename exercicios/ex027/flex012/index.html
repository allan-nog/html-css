<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Flexible Box </title>
    <style>
        .container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }
        .item{
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center; 
        }
        #cxA{
            flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 200px;
            /* Flex: grow shrink basis 
            flex: 0 1 200px; */
        }
        #cxB{
            /* flex-shrink: 1;
            flex-grow: 4;
            flex-basis: 150px; */
            flex: 1 4 150px;
        }
        #cxC{
            /* flex-shrink: 5;
            flex-grow: 0;
            flex-basis: auto; */
            flex: 5 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
